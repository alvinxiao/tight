name: Build and regression tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            node: '24.19.0'
          - os: windows-latest
            node: '24.19.0'
          - os: ubuntu-latest
            node: '22.13.0'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci --legacy-peer-deps --no-audit --no-fund
      - run: npm test
        env:
          TIGHT_USE_HTTP: 'true'
      - run: npm run build:client
        env:
          TIGHT_USE_HTTP: 'true'
      - run: npm run typecheck:browser
      - name: Install Chromium
        if: runner.os == 'Linux' && matrix.node == '24.19.0'
        run: npx playwright install --with-deps chromium
      - name: Browser regression tests
        if: runner.os == 'Linux' && matrix.node == '24.19.0'
        run: npx playwright test
      - name: Build bundled desktop backend
        if: matrix.node == '24.19.0'
        run: npm run build:desktop-backend
      - name: Electron integration tests on Linux
        if: runner.os == 'Linux' && matrix.node == '24.19.0'
        run: xvfb-run --auto-servernum npx playwright test --config=playwright.desktop.config.ts
        env:
          TIGHT_ELECTRON_TEST_NO_SANDBOX: 'true'
      - name: Electron integration tests on Windows
        if: runner.os == 'Windows'
        run: npx playwright test --config=playwright.desktop.config.ts
      - name: Package Windows preview
        if: runner.os == 'Windows'
        run: node scripts/package-desktop.mjs win32
      - name: Stage preview in a path with spaces and Unicode
        if: runner.os == 'Windows'
        shell: pwsh
        run: Copy-Item -Path release/TIGHT-win32-x64 -Destination "$env:RUNNER_TEMP/TIGHT preview 测试" -Recurse
      - name: Test packaged Windows executable
        if: runner.os == 'Windows'
        run: npx playwright test --config=playwright.desktop.config.ts
        env:
          TIGHT_DESKTOP_EXECUTABLE: ${{ runner.temp }}\TIGHT preview 测试\TIGHT.exe
      - uses: actions/upload-artifact@v4
        if: runner.os == 'Windows'
        with:
          name: TIGHT-windows-x64-preview
          path: release/TIGHT-win32-x64/
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: test-results-${{ matrix.os }}-${{ matrix.node }}
          path: test-results/
          if-no-files-found: ignore
